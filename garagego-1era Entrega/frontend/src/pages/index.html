<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="../styles/styles.css" />
</head>

<body>
  <div class="DivPrincipal">
    <div class="CajasdeRegistro">
      <!-- LOGO -->
      <img src="../../public/assets/icons/logo.png" alt="GarageGo" class="logo" />

      <h2>INICIAR SESIÓN</h2>
      <form id="loginForm">
        <button type="button" class="google-btn" id="googleLogin">
          <img src="../../public/assets/icons/google.png" class="google-icon" />
          CONTINUAR CON GOOGLE
        </button>

        <input type="email" id="email" name="email" placeholder="Email" maxlength="100" autocomplete="email" required />

        <div class="contenedor-password">
          <input type="password" id="password" name="password" placeholder="Contraseña" minlength="6" maxlength="64"
            autocomplete="current-password" required />

          <button type="button" class="btn-password" id="togglePassword">
            👁
          </button>
        </div>

        <button type="submit" class="boton">ACCEDER</button>
      </form>

      <button type="button" class="boton secundario" onclick="window.location.href = 'registro.html'">
        REGISTRARSE
      </button>

      <p class="registroLink">
        <a href="recuperar.html">¿OLVIDÓ SU CONTRASEÑA?</a>
      </p>
    </div>
  </div>

  <script src="../js/verContraseña.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabaseClient.js"></script>

  <script>
    document
      .getElementById("googleLogin")
      .addEventListener("click", iniciarSesionConGoogle);

    document
      .getElementById("loginForm")
      .addEventListener("submit", async (e) => {

        e.preventDefault();

        const email =
          document.getElementById("email").value.trim().toLowerCase();

        const password =
          document.getElementById("password").value;

        const {
          data,
          error
        } = await supabaseClient.auth.signInWithPassword({

          email,
          password

        });

        console.log(data);
        console.log(error);

        if (error) {

          alert(error.message);
          return;
        }

        window.location.href =
          "principal.html";

      });
  </script>
</body>

</html>
