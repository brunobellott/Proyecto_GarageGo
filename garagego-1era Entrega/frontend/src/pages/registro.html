<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro</title>
  <link rel="stylesheet" href="../styles/styles.css" />
</head>

<body>
  <div class="DivPrincipal">
    <div class="CajasdeRegistro">
      <!-- LOGO -->
      <img src="../../public/assets/icons/logo.png" alt="GarageGo" class="logo" />

      <h2>REGISTRO</h2>

      <form id="registerForm">
        <!-- GOOGLE -->
        <button type="button" class="google-btn" id="googleLogin">
          <img src="../../public/assets/icons/google.png" class="google-icon" />
          INGRESAR CON GOOGLE
        </button>
        <!---------------------------------------FORM REGISTRO--------------------------------------->
        <!--FIX---
          AGREGUE APELLIDO AL REGISTRO
          Los inputs tienen limite de caracteres
          AGREGUE VER CONTRASEÑA CON JS MODULARIZADO
          AGREGUE CHECKBOX TERMINOS Y CONDICIONES-->

        <!-- Nombre -->
        <input type="text" id="nombre" placeholder="NOMBRE" maxlength="50" required />
        <!-- Apellido -->
        <input type="text" id="apellido" placeholder="APELLIDO" maxlength="50" required />
        <!-- Email -->
        <input type="email" id="email" placeholder="EMAIL" maxlength="100" required />
        <!-- Contraseña -->

        <div class="contenedor-password">
          <input type="password" id="password" placeholder="CONTRASEÑA" minlength="6" maxlength="64" required />



          <button type="button" class="btn-password" id="togglePassword">
            👁
          </button>
        </div>

        <!-- Términos -->

        <div class="contenedor-terminos">
          <input type="checkbox" id="terminos" required />

          <label for="terminos"> Acepto los términos y condiciones </label>
        </div>

        <!---------------------------------------------------------------------------------->

        <div class="acciones">
          <button type="button" class="volver" onclick="history.back()">
            ←
          </button>

          <button type="submit" class="boton">REGISTRARSE</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/verContraseña.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabaseClient.js"></script>

  <script>

    console.log("Script Supabase cargado");

    document.getElementById("googleLogin").addEventListener("click", async () => {

      try {

        await iniciarSesionConGoogle();

      } catch (err) {

        console.error(err);
        alert("Error al iniciar sesión con Google");
      }

    });

  </script>

  <script>
    document
      .getElementById("registerForm")
      .addEventListener("submit", async (e) => {

        e.preventDefault();

        const nombre =
          document.getElementById("nombre").value;

        const apellido =
          document.getElementById("apellido").value;

        const email =
          document.getElementById("email").value.trim().toLowerCase();

        const password =
          document.getElementById("password").value;

        try {

          const emailYaExiste =
            await emailExisteEnUsuario(email);

          if (emailYaExiste) {

            alert("Ya existe una cuenta registrada con ese email.");
            return;
          }

        } catch (error) {

          alert("No se pudo validar el email. Intenta nuevamente.");
          return;
        }

        // 1. Crear usuario en Supabase Auth
        const {
          data,
          error
        } = await supabaseClient.auth.signUp({

          email,
          password,

          options: {
            data: {
              nombre,
              apellido
            }
          }

        });

        console.log("DATA:", data);
        console.log("ERROR:", error);

        if (error) {

          alert(error.message);
          return;
        }

        // 2. Guardar datos en tabla usuario
        const { error: errorTabla } =
          await supabaseClient
            .from("usuario")
            .insert([
              {
                nombre,
                apellido,
                email,
                password: null,
                rol: "usuario",
                proveedor: "local"
              }
            ]);

        if (errorTabla) {

          console.error(errorTabla);
          alert(errorTabla.message);
          return;
        }

        alert("Usuario registrado");

        window.location.href =
          "index.html";

      });
  </script>

</body>

</html>
