<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Google Login</title>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseClient =
  window.supabase.createClient(
    "https://osoaswcekympiqumpcnc.supabase.co",
    "sb_publishable_ZUkfOyK172bO9ZxQhva9QQ_Y2z8KFf6"
  );

async function guardarUsuarioGoogle() {

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    window.location.href = "index.html";
    return;
  }

  const nombreCompleto =
    user.user_metadata.full_name || "";

  const partes =
    nombreCompleto.split(" ");

  const nombre =
    partes[0] || "";

  const apellido =
    partes.slice(1).join(" ");

  const { data: existe } =
    await supabaseClient
      .from("usuario")
      .select("*")
      .eq("email", user.email);

  if (!existe || existe.length === 0) {

    const { error } =
      await supabaseClient
        .from("usuario")
        .insert([
          {
            nombre,
            apellido,
            email: user.email,
            password: null,
            rol: "usuario",
            proveedor: "google"
          }
        ]);

    if(error){
      console.error(error);
    }
  }

  window.location.href = "principal.html";
}

guardarUsuarioGoogle();

</script>

</body>
</html>
